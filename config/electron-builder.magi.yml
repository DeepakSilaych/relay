appId: me.deepaksilaych.magi
productName: Relay
artifactName: Relay-${version}-${arch}.${ext}
extraMetadata:
  magiAutoUpdate: false
  name: relay
  version: 0.2.9
  main: out/magi/main/index.js
npmRebuild: false
directories:
  app: out/magi-package
  output: dist-magi
files:
  - out/magi/**
  - package.json
  - LICENSE
extraResources:
  - from: resources/magi/backend
    to: magi/backend
    filter:
      - magi.py
      - sess
      - SESS-LICENSE
asarUnpack:
  - '**/node-pty/**'
mac:
  identity: "-"
  hardenedRuntime: true
  entitlements: resources/magi/entitlements.mac.plist
  entitlementsInherit: resources/magi/entitlements.mac.plist
  icon: resources/magi/brand/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  target: nsis
linux:
  category: Development
  target: AppImage
publish:
  provider: github
  owner: DeepakSilaych
  repo: relay
